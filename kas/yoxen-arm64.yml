header:
  version: 11
  includes:
    - kas/yoxen.yml

# When booting from initrd you may need to use core-image-minial
# to get smaller rootfs that fits into reasonably sized guests.
# In particular if you're running multiple QEMU's with multiple
# Xen instances on a laptop.
machine: qemuarm64
distro: yoxen
target:
  - xen-image-minimal

local_conf_header:
  arch-apps: |
        IMAGE_INSTALL:append = " virtio-msg-demo-aarch64"
  custom-xen: |
    PREFERRED_VERSION_xen = "4.18.2+stable"
    PREFERRED_VERSION_xen-tools = "4.18+stable"
    INHERIT:append = " externalsrc"
    EXTERNALSRC:pn-xen = "/home/edgar/xilinx/sw/xen"
    EXTERNALSRC:pn-xen-tools = "/home/edgar/xilinx/sw/xen"
    EXTERNALSRC_BUILD:pn-xen = "/home/edgar/xilinx/sw/xen"
    EXTERNALSRC_BUILD:pn-xen-tools = "/home/edgar/xilinx/sw/xen"
