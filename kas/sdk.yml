header:
  version: 9

build_system: oe

local_conf_header:
  sdk-extra-packages: |
    IMAGE_INSTALL:append = " qemu "
    TOOLCHAIN_HOST_TASK:append = " nativesdk-python3-setuptools nativesdk-python3-build nativesdk-python3-dev "
    TOOLCHAIN_HOST_TASK:append = " nativesdk-python3-flit-core nativesdk-python3-iniparse nativesdk-python3-installer "
    TOOLCHAIN_HOST_TASK:append = " nativesdk-python3-packaging nativesdk-python3-wheel "
    TOOLCHAIN_HOST_TASK:append = " nativesdk-python3-six nativesdk-python3-pyproject-hooks"

task: populate_sdk
