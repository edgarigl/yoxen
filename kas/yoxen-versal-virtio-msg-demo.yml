header:
  version: 11
  includes:
    - kas/yoxen.yml

machine: versal-generic
distro: yoxen
target:
  - versal-virtio-msg-demo-image

repos:
  yoxen:

  meta-xilinx:
    url: https://github.com/Xilinx/meta-xilinx.git
    path: layers/meta-xilinx
    #branch: scarthgap
    commit: 936845b97ab1ff035108f219f4e7cfef5401eb02
    layers:
      meta-xilinx-core:
      meta-xilinx-standalone:
      meta-xilinx-bsp:
      meta-xilinx-virtualization:

  meta-security:
    url: https://git.yoctoproject.org/git/meta-security
    path: layers/meta-security
    #branch: scarthgap
    commit: bc865c5276c2ab4031229916e8d7c20148dfbac3
    layers:
      ../meta-security:
      meta-tpm:

  meta-arm:
    url: https://git.yoctoproject.org/git/meta-arm
    path: layers/meta-arm
    #branch: scarthgap
    commit: 8e0f8af90fefb03f08cd2228cde7a89902a6b37c
    layers:
      meta-arm:
      meta-arm-toolchain:

  meta-openamp:
    url: https://github.com/Xilinx/meta-openamp.git
    path: layers/meta-openamp
    commit: e44e4a3b4abe9cc5fdfe75c43181ba82750f6865

  meta-virtio-msg-demo:
    url: https://github.com/edgarigl/meta-virtio-msg-demo.git
    path: layers/meta-virtio-msg-demo
    commit: f7934afff0a10e42b65ed8a12ee9d441d11d1519

local_conf_header:
  fstypes: |
    IMAGE_FSTYPES:append = " wic wic.qcow2"
  virtio-msg: |
    # Uncomment if you accept the Xilinx PMU license.
    #        LICENSE_FLAGS_ACCEPTED:append = " xilinx"
    # We want upstream QEMU + virtio-msg patches (not Xilinx QEMU).
    DEFAULT_XILINX_QEMU:aarch64 = "qemu"
    # When changing version, you need to clean kernel and modules
    # kas shell kas/yoxen-versal-virtio-msg-demo.yml -c "bitbake -c cleansstate linux-xlnx uio-nc-mem-mod"
    XILINX_RELEASE_VERSION = "v2024.1"
    QEMU_TARGETS = "aarch64"
    CONFIG_DTFILE = "${TOPDIR}/../layers/meta-virtio-msg-demo/dts/system.dts"
    EXTRA_DT_FILES = "${TOPDIR}/../layers/meta-virtio-msg-demo/dts/overlay-virtio-msg.dtsi"
    EXTRA_DT_FILES:append = " ${TOPDIR}/../layers/meta-virtio-msg-demo/dts/overlay-xen.dtsi"
    EXTRA_DT_FILES:append = " ${TOPDIR}/../layers/meta-virtio-msg-demo/dts/system-user.dtsi"
