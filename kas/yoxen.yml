header:
  version: 11

repos:
  yoxen:

  poky:
    url: https://git.yoctoproject.org/git/poky
    path: layers/poky
    #branch: scarthgap
    commit: 792d18b4cb2451b00280641403e6eaf37bd6e53f
    layers:
      meta:
      meta-poky:
      meta-yocto-bsp:

  meta-openembedded:
    url: http://git.openembedded.org/meta-openembedded
    path: layers/meta-openembedded
    #branch: scarthgap
    commit: e8fd97d86af86cdcc5a6eb3f301cbaf6a2084943
    layers:
      meta-oe:
      meta-python:
      meta-filesystems:
      meta-networking:
      meta-multimedia:

  meta-virtualization:
    url: http://git.yoctoproject.org/git/meta-virtualization
    path: layers/meta-virtualization
    #branch: scarthgap
    commit: a5449c0c50aa07d02186f548fe6bb6c1ce8823dc

local_conf_header:
  yoxen: |
    #USER_CLASSES:append = " buildhistory buildstats buildstats-summary"
    USER_CLASSES:append = " buildstats buildstats-summary"
    INHERIT:append = " rm_work"
    RM_OLD_IMAGE = "1"
    #    BB_GIT_SHALLOW = "1"
    BB_GIT_SHALLOW_DEPTH = "1"
    BB_GENERATE_SHALLOW_TARBALLS = "1"
    PACKAGE_FEED_URIS = "http://10.0.2.2:8000/deploy/"
    PACKAGE_FEED_BASE_PATHS = "ipk"
    SOURCE_MIRROR_URL = "http://localhost:8000/downloads"
    BB_NUMBER_THREADS = "3"
    PARALLEL_MAKE = "-j 5"
    PACKAGE_CLASSES = "package_ipk"
  xen: |
    #DISTRO_FEATURES:append = " virtualization xen"
    DISTRO_FEATURES:append = " virtualization"
    QEMU_TARGETS = "i386 x86_64 aarch64"
    NETWORK_XEN_BRIDGE = "0"
  fstypes: |
    IMAGE_FSTYPES:append = " ext4 ext4.gz tar.bz2 cpio.gz cpio.gz.u-boot"
  remove-ptest: |
    DISTRO_FEATURES:remove = " ptest"
  debug-tweaks: |
    EXTRA_IMAGE_FEATURES = "debug-tweaks"
    IMAGE_INSTALL:append = " glibc-dbg"
    IMAGE_INSTALL:append = " gdb strace ltrace"
    IMAGE_INSTALL:append = " vim"
    IMAGE_INSTALL:append = " bridge-utils"
    IMAGE_INSTALL:append = " tcpdump"
    IMAGE_INSTALL:append = " openssh"
    IMAGE_INSTALL:append = " ethtool"
    IMAGE_INSTALL:append = " pciutils"
    IMAGE_INSTALL:append = " devmem2"
    IMAGE_INSTALL:append = " pcimem"
    IMAGE_INSTALL:append = " iperf3"
    IMAGE_INSTALL:append = " fio"
    IMAGE_INSTALL:append = " qemu"
    #    IMAGE_INSTALL:append = " xen"
    IMAGE_INSTALL:append = " xen-tools-dbg"
    #    IMAGE_INSTALL:append = " acpica"
    IMAGE_INSTALL:append = " memtester"
    IMAGE_INSTALL:append = " tcf-agent"
  version: |
    CONF_VERSION = "2"
  shared-dl: |
    DL_DIR = "${TOPDIR}/downloads/"
    SSTATE_DIR = "${TOPDIR}/sstate-cache/"
